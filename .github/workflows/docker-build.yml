name: Docker build

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - Gemfile
      - Gemfile.lock
      - .github/workflows/docker-build.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Gemfile
      - Gemfile.lock
      - .github/workflows/docker-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag pubannotation:ci .
